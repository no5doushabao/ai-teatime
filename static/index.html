<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>🍵 AI 讨论会</title>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font: 14px/1.7 "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
    background: linear-gradient(160deg, #1b1b21 0%, #17171c 60%, #14141a 100%);
    color: #e8e8ee; display: flex; flex-direction: column;
    overflow: hidden; user-select: none;
  }

  /* ── 顶栏 ── */
  header {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 14px; background: rgba(30,30,38,.92);
    border-bottom: 1px solid #2c2c36; backdrop-filter: blur(6px);
  }
  .gname { font-weight: 700; font-size: 15px; }
  .gsub  { font-size: 11px; color: #8b8b9c; }
  .members { display: flex; margin-left: auto; }
  .members img {
    width: 26px; height: 26px; border-radius: 50%;
    margin-left: -8px; border: 2px solid #1e1e26; background: #26262e;
    image-rendering: pixelated; transition: transform .15s;
  }
  .members img:hover { transform: translateY(-2px) scale(1.08); }
  .round-badge {
    margin-left: 10px; font-size: 11px; padding: 3px 9px; border-radius: 10px;
    background: #2a3d5c; color: #9ecbff; border: 1px solid #35507a; white-space: nowrap;
  }

  /* ── 议题条 ── */
  #topicBar {
    display: none; align-items: center; gap: 8px;
    padding: 7px 14px; font-size: 12px; color: #9ecbff;
    background: #212836; border-bottom: 1px solid #2c3a52;
  }
  #topicBar.on { display: flex; }
  #topicBar .tl { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* ── 消息流 ── */
  #flow { flex: 1; overflow-y: auto; padding: 16px 16px 6px; scroll-behavior: smooth; }
  #flow::-webkit-scrollbar { width: 8px; }
  #flow::-webkit-scrollbar-thumb { background: #33333e; border-radius: 4px; }

  .row { display: flex; gap: 10px; margin-bottom: 16px; align-items: flex-start;
         animation: pop .18s ease-out; }
  @keyframes pop { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; } }
  .row.me { flex-direction: row-reverse; }

  .row img.av {
    width: 42px; height: 42px; border-radius: 50%; flex: 0 0 42px;
    background: #26262e; border: 2px solid #2f2f3a; image-rendering: pixelated;
  }
  .row.me img.av { border-color: #4a6fa5; }
  .body { max-width: 88%; }          /* ⭐ 加宽：长发言要放得下 */
  .row.me .body { text-align: right; }

  .meta { font-size: 11px; color: #83839a; margin-bottom: 4px; }
  .meta .nm { color: #b9b9cc; font-weight: 600; font-size: 12.5px; }
  .meta .org { color: #6c6c80; margin-left: 5px; }

  .bubble {
    display: inline-block; text-align: left; padding: 11px 15px;
    border-radius: 13px; background: #2a2a34; color: #e9e9f0;
    word-break: break-word; box-shadow: 0 1px 3px rgba(0,0,0,.35);
    border: 1px solid #33333f; white-space: pre-wrap;
  }
  .row.me .bubble { background: #3a5c8a; border-color: #4a6fa5; color: #fff; }
  .row[data-who="grok"]   .bubble { border-left: 3px solid #6c6c7c; }
  .row[data-who="qwen"]   .bubble { border-left: 3px solid #8a6fd0; }
  .row[data-who="claude"] .bubble { border-left: 3px solid #d67a5c; }
  .row[data-who="gpt"]    .bubble { border-left: 3px solid #2f9e80; }
  .row[data-who="ayu"]    .bubble { border-left: 3px solid #5696d6; }

  /* ⭐ 长文折叠按钮 */
  .more {
    display: block; margin-top: 7px; font-size: 11.5px; cursor: pointer;
    color: #8fb8e8; background: rgba(90,140,210,.13); border: 1px solid #35507a;
    padding: 3px 10px; border-radius: 9px; width: fit-content;
  }
  .more:hover { background: rgba(90,140,210,.24); }

  .sys { text-align: center; margin: 10px 0 14px; }
  .sys span {
    font-size: 11px; color: #7d7d92; background: #23232c;
    padding: 3px 12px; border-radius: 10px; border: 1px solid #2d2d38;
  }
  .sys.round span { color: #9ecbff; background: #232b3a; border-color: #33445e;
                    font-weight: 600; letter-spacing: .5px; }

  /* ⭐ 会议纪要卡片（公用历史框） */
  .notes {
    margin: 12px 0 16px; padding: 12px 15px; border-radius: 12px;
    background: linear-gradient(180deg, rgba(60,80,60,.22), rgba(40,55,45,.18));
    border: 1px solid #3d513d; font-size: 13px; color: #cfe6cf;
    white-space: pre-wrap; line-height: 1.75;
  }
  .notes .nh { font-weight: 700; color: #b7e0b7; margin-bottom: 6px; font-size: 12.5px; }

  /* ── 底栏 ── */
  footer { padding: 10px 14px 12px; background: rgba(30,30,38,.92);
           border-top: 1px solid #2c2c36; }
  .seat { font-size: 11px; color: #7d7d92; margin-bottom: 6px;
          display: flex; align-items: center; gap: 6px; }
  .seat .sp { flex: 1; }
  .inputbar { display: flex; gap: 8px; }
  input {
    flex: 1; padding: 10px 13px; border-radius: 10px; border: 1px solid #34343f;
    background: #22222b; color: #eaeaf2; font-size: 14px; outline: none;
  }
  input:focus { border-color: #4a6fa5; box-shadow: 0 0 0 2px rgba(74,111,165,.22); }
  button {
    padding: 0 18px; border-radius: 10px; border: 0; cursor: pointer;
    background: linear-gradient(180deg,#4a7fc4,#3d68a0); color: #fff;
    font-size: 14px; font-weight: 600;
  }
  button:active { transform: translateY(1px); }
  button:disabled { opacity: .45; cursor: default; }
  .mini {
    padding: 3px 10px; font-size: 11.5px; border-radius: 8px; font-weight: 400;
    background: #2f3d2f; color: #b7e0b7; border: 1px solid #3d513d;
  }
  .mini:hover { background: #3a4c3a; }

  /* ── ⭐ 议题选择弹窗 ── */
  .modal {
    position: fixed; inset: 0; background: rgba(8,8,12,.72);
    display: flex; align-items: center; justify-content: center;
    backdrop-filter: blur(3px); z-index: 50; animation: pop .2s ease-out;
  }
  .modal.hidden { display: none; }
  /* ⭐ 叠在别的弹窗之上的弹窗（确认框、增加议题）—— 它们是从议题一览里点出来的，
     而议题一览在 DOM 里排在后面，不给更高层级就会被盖住（踩过） */
  .modal.top { z-index: 120; }
  .mbox {
    width: 94%; max-width: 780px; max-height: 90vh; display: flex; flex-direction: column;
    background: #212129; border: 1px solid #34343f; border-radius: 16px;
    box-shadow: 0 18px 50px rgba(0,0,0,.6); overflow: hidden;
  }
  .mhead { padding: 16px 20px 10px; }
  .mtitle { font-size: 17px; font-weight: 700; }
  .msub { font-size: 12px; color: #8b8b9c; margin-top: 4px; }
  .tlist { padding: 6px 12px 4px; overflow-y: auto; }
  .tlist::-webkit-scrollbar { width: 8px; }
  .tlist::-webkit-scrollbar-thumb { background: #33333e; border-radius: 4px; }
  .titem {
    display: flex; gap: 10px; padding: 11px 13px; margin: 6px 0; cursor: pointer;
    border-radius: 11px; border: 1px solid #2f2f3a; background: #26262e;
    transition: all .12s;
  }
  .titem:hover { background: #2d2d38; border-color: #3d4a5e; }
  .titem.sel { background: #2a3d5c; border-color: #4a7fc4; box-shadow: 0 0 0 2px rgba(74,127,196,.25); }
  .titem .ti {
    flex: 0 0 24px; height: 24px; line-height: 24px; text-align: center;
    border-radius: 7px; background: #33333f; font-size: 12px; color: #9ecbff; font-weight: 700;
  }
  .titem.sel .ti { background: #4a7fc4; color: #fff; }
  .titem .tt { font-size: 13.5px; line-height: 1.55; }
  .titem .tb { font-size: 11.5px; color: #83839a; margin-top: 3px;
               overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .mfoot { padding: 12px 20px 18px; display: flex; gap: 10px; align-items: center; }
  .mfoot .hint { flex: 1; font-size: 11.5px; color: #83839a; }
  .ghost { background: #2a2a34; border: 1px solid #3a3a46; color: #c9c9d6; }

  /* ⭐ 议题一览 */
  .hitem { padding: 12px 14px; margin: 7px 0; border-radius: 11px;
           border: 1px solid #2f2f3a; background: #26262e;
           cursor: grab; transition: background .12s, border-color .12s; }
  .hitem:hover { background: #2d2d38; border-color: #3d4a5e; }
  .hitem.dragging { opacity: .45; border-color: #4a7fc4; background: #2a3d5c; cursor: grabbing; }
  .hitem .hrow { display: flex; align-items: flex-start; gap: 8px; }
  .hitem .hd { display: flex; align-items: baseline; gap: 8px; flex: 1; min-width: 0; }
  .hitem .grip { color: #565668; font-size: 15px; cursor: grab; flex: 0 0 auto; }
  .hitem .num  { color: #9ecbff; font-weight: 700; font-size: 12.5px; flex: 0 0 auto; }
  .hitem .ht { font-size: 14px; line-height: 1.6; }
  .hitem .hm { font-size: 12px; color: #83839a; margin-top: 6px; padding-left: 26px; }
  .hitem .done { color: #9fd39f; font-weight: 600; }
  .hitem .todo { color: #7d7d92; }
  .hitem .who  { color: #9ecbff; }
  /* ⭐ 每项的小按钮（删除 / 重置）*/
  .hbtns { display: flex; gap: 6px; flex: 0 0 auto; opacity: .35; transition: opacity .12s; }
  .hitem:hover .hbtns { opacity: 1; }
  .ibtn {
    padding: 4px 9px; font-size: 12.5px; line-height: 1.2; border-radius: 8px; cursor: pointer;
    background: #2f2f3a; border: 1px solid #3d3d4a; color: #c9c9d6; font-weight: 400;
  }
  .ibtn:hover { background: #3a3a46; }
  .ibtn.del:hover { background: #5c2f2f; border-color: #8a4444; color: #ffd9d9; }
  .ibtn.rst:hover { background: #2f4a3a; border-color: #447a55; color: #d9ffe4; }
  /* ⭐ 增加议题弹窗 */
  .abody { padding: 4px 20px 8px; overflow-y: auto; }
  .abody label { display: block; font-size: 12.5px; color: #9aa9c0; margin: 12px 0 5px; }
  .abody input, .abody textarea {
    width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid #34343f;
    background: #22222b; color: #eaeaf2; font-size: 14px; outline: none;
    font-family: inherit; resize: vertical;
  }
  .abody input:focus, .abody textarea:focus { border-color: #4a6fa5; box-shadow: 0 0 0 2px rgba(74,111,165,.22); }
  .abody textarea { min-height: 150px; line-height: 1.7; }
  .abody .tip { font-size: 11.5px; color: #6c6c80; margin-top: 5px; }
  .abody .errtxt { color: #ffb0b0; font-size: 12px; margin-top: 8px; min-height: 16px; }
  /* ⭐ 现场提问面板 */
  .la-hint { font-size: 12.5px; color: #9aa9c0; margin: 14px 0 8px; }
  .la-avatars { display: flex; flex-wrap: wrap; gap: 10px; }
  .la-av { display: flex; flex-direction: column; align-items: center; gap: 4px;
           padding: 8px 11px; border-radius: 11px; cursor: pointer;
           background: #26262e; border: 1px solid #2f2f3a; transition: all .12s; }
  .la-av:hover { background: #2d3d54; border-color: #4a7fc4; transform: translateY(-2px); }
  .la-av img { width: 44px; height: 44px; border-radius: 50%; image-rendering: pixelated; }
  .la-av span { font-size: 11.5px; color: #b9b9cc; }
  .la-status { font-size: 12px; color: #9ecbff; margin-top: 10px; min-height: 18px; }
  .la-answer { margin-top: 10px; }
  .la-who { font-size: 12px; color: #9ecbff; font-weight: 600; margin-bottom: 5px; }
  .la-bubble { padding: 11px 13px; border-radius: 11px; background: #2a2a34;
               border: 1px solid #33333f; font-size: 13px; line-height: 1.75;
               white-space: pre-wrap; max-height: 220px; overflow-y: auto; }
  .la-btns { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .la-btns button { padding: 7px 15px; font-size: 13px; }
  /* ⭐ 备选议题：题目 + 理由 */
  .la-item { margin-bottom: 10px; }
  .la-item:last-child { margin-bottom: 0; }
  .la-t { font-weight: 600; color: #eaecf5; }
  .la-r { font-size: 12.5px; color: #9fd39f; margin-top: 3px; }

  /* ⭐ 最终会议纪要（阿鱼整理的那份大总结） */
  .summary {
    margin: 18px 0; padding: 16px 18px; border-radius: 14px;
    background: linear-gradient(180deg, rgba(70,90,130,.28), rgba(45,60,90,.22));
    border: 1px solid #4a6fa5; font-size: 13.5px; color: #dfe8f5;
    white-space: pre-wrap; line-height: 1.85; box-shadow: 0 4px 18px rgba(0,0,0,.35);
  }
  .summary .sh {
    font-weight: 700; color: #9ecbff; margin-bottom: 10px; font-size: 14px;
    padding-bottom: 8px; border-bottom: 1px solid #35507a;
  }
  /* ⭐ 结束议题的询问条（做成一条"阿鱼在问你"的卡片） */
  .askbox .mhead { border-bottom: 1px solid #2f2f3a; margin-bottom: 4px; }
</style>
</head>
<body>
<header>
  <div>
    <div class="gname">🍵 AI 讨论会</div>
    <div class="gsub">圆桌制 · 阿鱼主持 · 一轮每人一次</div>
  </div>
  <div class="members" id="members"></div>
  <div class="round-badge" id="roundBadge">准备中</div>
</header>

<div id="topicBar" class="on">
  <span>📌</span><span class="tl" id="topicText">还没选议题 —— 点右下角「🍵 开场 / 换议题」挑一个</span>
  <button class="mini" id="libBtn">📋 议题一览</button>
  <button class="mini" id="changeTopic">换议题</button>
</div>

<div id="flow"></div>

<footer>
  <div class="seat">
    <span>💬 旁听席（你）—— 说的话会进下一轮，大家都会看到</span>
    <span class="sp"></span>
    <button id="stopBtn" class="mini">🛑 结束议题</button>
    <button id="startBtn" class="mini">🍵 开场 / 换议题</button>
  </div>
  <div class="inputbar">
    <input id="msg" placeholder="说点什么…（Enter 发送）" autocomplete="off">
    <button id="send">发送</button>
  </div>
</footer>

<!-- ⭐ 议题选择弹窗：每次打开窗口都会弹出来 -->
<div id="modal" class="modal hidden">
  <div class="mbox">
    <div class="mhead">
      <div class="mtitle">🍵 今晚讨论什么？</div>
      <div class="msub" id="mSub">正在读取议题…</div>
    </div>
    <div class="tlist" id="topicList"></div>
    <div class="mfoot">
      <span class="hint" id="mHint"></span>
      <button class="ghost" id="mClose">先不开始</button>
      <button id="mStart" disabled>开始讨论</button>
    </div>
  </div>
</div>

<!-- ⭐ 增加议题（阿包定的字段：题目 → 选题理由 → 由谁提供）-->
<div id="addModal" class="modal top hidden">
  <div class="mbox" style="max-width:600px">
    <div class="mhead">
      <div class="mtitle">➕ 增加议题</div>
      <div class="msub">加完会出现在议题一览的最后，位置可以拖动调整</div>
    </div>
    <div class="abody">
      <label for="addTitle">议题题目</label>
      <input id="addTitle" placeholder="一句话说清要讨论什么" autocomplete="off" maxlength="120">
      <label for="addReason">选题理由</label>
      <textarea id="addReason" placeholder="为什么想聊这个？希望听到什么？有什么背景可以交代？"></textarea>
      <label for="addAuthor">由谁提供</label>
      <input id="addAuthor" placeholder="你自己的名字，或某个 AI 的名字" autocomplete="off" maxlength="24">
      <div class="tip">留空也行 —— 议题一览里会显示「（未标注）」</div>
      <div class="errtxt" id="addErr"></div>

      <!-- ⭐ 现场提问：点了按钮才展开 -->
      <div id="laPanel" class="hidden">
        <div class="la-hint">🎤 选一位在座的 AI，让它提几个议题备选：</div>
        <div id="laAvatars" class="la-avatars"></div>
        <div id="laStatus" class="la-status"></div>
        <div id="laAnswer" class="hidden">
          <div class="la-who" id="laWho"></div>
          <div class="la-bubble" id="laBubble"></div>
          <div class="la-btns" id="laBtns"></div>
        </div>
      </div>
    </div>
    <div class="mfoot">
      <button class="ghost" id="liveAsk">🎤 现场提问</button>
      <span class="hint"></span>
      <button class="ghost" id="addCancel">取消</button>
      <button id="addSave">保存</button>
    </div>
  </div>
</div>

<!-- ⭐ 通用确认框（删除议题这种危险操作要问一句）-->
<div id="cfModal" class="modal top hidden">
  <div class="mbox" style="max-width:440px">
    <div class="mhead">
      <div class="mtitle" id="cfTitle">确认？</div>
      <div class="msub" id="cfBody" style="font-size:13px;line-height:1.75;color:#c9d6e8"></div>
    </div>
    <div class="mfoot" style="justify-content:flex-end">
      <button class="ghost" id="cfNo">取消</button>
      <button id="cfYes">确定</button>
    </div>
  </div>
</div>

<!-- ⭐ 结束议题后，阿鱼来问一句 -->
<div id="askModal" class="modal hidden">
  <div class="mbox askbox" style="max-width:420px">
    <div class="mhead">
      <div class="mtitle">🛑 讨论结束了</div>
      <div class="msub" style="font-size:13px;color:#c9d6e8;line-height:1.7">
        <b>阿鱼：</b>要我把这场讨论整理成一份会议纪要吗？<br>
        <span style="color:#8b8b9c">（会汇总各方立场、关键交锋和没结论的问题，存进本场记录里）</span>
      </div>
    </div>
    <div class="mfoot" style="justify-content:flex-end">
      <button class="ghost" id="askNo">不用了</button>
      <button id="askYes">需要，帮我整理</button>
    </div>
  </div>
</div>

<!-- ⭐ 议题库：所有议题 + 讨论过的轮次与参与者 -->
<div id="libModal" class="modal hidden">
  <div class="mbox">
    <div class="mhead">
      <div class="mtitle">📋 议题一览</div>
      <div class="msub" id="libSub">正在读取…</div>
    </div>
    <div class="tlist" id="libList"></div>
    <div class="mfoot">
      <span class="hint">⭐ <b>按住拖动可以排序</b>，松手即保存（写回 <code>topics.md</code>）</span>
      <button class="ghost" id="libAdd">➕ 增加议题</button>
      <button id="libClose">关闭</button>
    </div>
  </div>
</div>

<script>
const FALLBACK = ["ayu", "grok", "qwen", "claude", "gpt"];
const flow = document.getElementById("flow");
const badge = document.getElementById("roundBadge");
const modal = document.getElementById("modal");
let lastRound = 0;
let lastSeq = 0;
let pickedTopic = null;
let canStart = false;

function esc(s) {
  return (s || "").replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
}

/* ── 顶栏成员头像 ── */
const members = document.getElementById("members");
fetch("/roster").then(r => r.json()).then(d => {
  const list = (d.guests && d.guests.length) ? d.guests : FALLBACK.map(w => ({ who: w, ready: true }));
  list.forEach(g => {
    const im = document.createElement("img");
    im.src = `/avatars/${g.who}.png`;
    im.title = (g.name || g.who) + (g.ready ? "" : "（没配 key）");
    if (!g.ready) im.style.opacity = "0.3";
    members.appendChild(im);
  });
}).catch(() => {
  FALLBACK.forEach(w => {
    const im = document.createElement("img");
    im.src = `/avatars/${w}.png`; im.title = w;
    members.appendChild(im);
  });
});

/* ── ⭐ 议题弹窗 ── */
const topicList = document.getElementById("topicList");
const mSub = document.getElementById("mSub");
const mHint = document.getElementById("mHint");
const mStart = document.getElementById("mStart");

function showModal() { modal.classList.remove("hidden"); }
function hideModal() { modal.classList.add("hidden"); }

function loadTopics() {
  fetch("/topics").then(r => r.json()).then(d => {
    topicList.innerHTML = "";
    const n = d.topics.length;
    mSub.textContent = `共 ${n} 个议题 · 在场 ${d.ready} 位（至少 ${d.min_guests} 位可开场）`;
    canStart = d.ready >= d.min_guests;
    mHint.textContent = canStart ? "选一个议题，阿鱼会开场主持" : `⚠️ 只有 ${d.ready} 位就绪，还差 ${d.min_guests - d.ready} 位`;
    mStart.disabled = !canStart;
    d.topics.forEach(t => {
      const el = document.createElement("div");
      el.className = "titem" + (t.index === d.current ? " sel" : "");
      el.dataset.index = t.index;
      const byline = t.author ? `<div class="tb">由 ${esc(t.author)} 提出</div>` : "";
      el.innerHTML = `<div class="ti">${t.index + 1}</div><div><div class="tt">${esc(t.title)}</div>${byline}</div>`;
      el.onclick = () => {
        topicList.querySelectorAll(".titem").forEach(x => x.classList.remove("sel"));
        el.classList.add("sel");
        pickedTopic = t.index;
        mStart.disabled = !canStart;
        if (canStart) document.getElementById("topicText").textContent = t.title;
      };
      topicList.appendChild(el);
      if (pickedTopic === null) pickedTopic = d.current;
    });
    showModal();
  }).catch(() => { mSub.textContent = "读不到议题（服务没起来？）"; showModal(); });
}

/* ── ⭐ 议题一览（所有议题 + 战绩 + 可拖动排序）── */
const libModal = document.getElementById("libModal");
const libList = document.getElementById("libList");
const libSub = document.getElementById("libSub");

function attachDnD(el) {
  el.ondragstart = e => {
    el.classList.add("dragging");
    e.dataTransfer.effectAllowed = "move";
    e.dataTransfer.setData("text/plain", el.dataset.index);   // Firefox 需要
  };
  // ⭐ 关键：拖动预览靠**移动 DOM 节点**，不能重建列表
  //    （重建会把正在拖的那个元素销毁掉，拖动当场中断）
  el.ondragover = e => {
    e.preventDefault();
    const dragged = libList.querySelector(".dragging");
    if (!dragged || dragged === el) return;
    const r = el.getBoundingClientRect();
    const after = (e.clientY - r.top) > r.height / 2;
    libList.insertBefore(dragged, after ? el.nextSibling : el);
  };
  el.ondragend = async () => {
    el.classList.remove("dragging");
    // ⭐ DOM 顺序就是新顺序（data-index 存的是原始下标）
    const order = [...libList.children].map(c => Number(c.dataset.index));
    try {
      const r = await fetch("/topics/reorder", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ order })
      });
      const j = await r.json();
      libSub.textContent = j.ok ? "✅ 新顺序已保存到 topics.md"
                                : "⚠️ 保存失败（顺序不合法？）";
      [...libList.children].forEach((c, i) => {
        const n = c.querySelector(".num");
        if (n) n.textContent = (i + 1) + ".";
      });
    } catch (_) { libSub.textContent = "⚠️ 保存失败（服务没响应）"; }
  };
}

function showLib() {
  libModal.classList.remove("hidden");
  libSub.textContent = "正在读取…";
  libList.innerHTML = "";
  Promise.all([
    fetch("/topics").then(r => r.json()),
    fetch("/history").then(r => r.json()).catch(() => ({ debates: [] }))
  ]).then(([t, h]) => {
    const debates = (h && h.debates) || [];
    libSub.textContent = `共 ${t.topics.length} 个议题 · 已讨论 ${debates.length} 场 · 按住拖动可排序`;
    t.topics.forEach(tp => {
      const mine = debates.filter(d => (d.topic || "").trim() === tp.title.trim());
      const el = document.createElement("div");
      el.className = "hitem";
      el.dataset.index = tp.index;          // ⭐ 原始下标（保存顺序要用）
      el.draggable = true;
      let meta;
      if (mine.length) {
        const last = mine[mine.length - 1];
        const total = mine.reduce((a, x) => a + (x.rounds_done || 0), 0);
        const who = [...new Set(mine.flatMap(x => x.participants || []))].join("、");
        meta = `<span class="done">（已讨论 ${total} 个轮次${mine.length > 1 ? ` · ${mine.length} 场` : ""}）</span>` +
               ` 参与者：<span class="who">${esc(who)}</span>` +
               (last.finished ? ` <span class="todo">· 最近 ${esc(last.finished)}</span>`
                              : ` <span class="todo">· 进行中</span>`);
      } else {
        meta = `<span class="todo">（还没讨论过）</span>`;
      }
      // ⭐ 由谁提供（阿包要的，显示在战绩前面）
      const by = tp.author ? `由 <span class="who">${esc(tp.author)}</span> 提供 · ` : `<span class="todo">（未标注提出者）</span> · `;
      meta = by + meta;
      el.innerHTML =
        `<div class="hrow"><div class="hd"><span class="grip">⠿</span><span class="num">${tp.index + 1}.</span>` +
        `<span class="ht">${esc(tp.title)}</span></div>` +
        `<div class="hbtns">` +
        `<button class="ibtn rst" title="清空这个议题的讨论战绩（议题保留）">♻️ 重置</button>` +
        `<button class="ibtn del" title="从议题库删掉这个议题">🗑 删除</button>` +
        `</div></div><div class="hm">${meta}</div>`;
      // ⭐ 按钮必须阻止拖动，否则点按钮会变成"拖动议题"
      el.querySelectorAll(".ibtn").forEach(b => {
        b.draggable = false;
        b.onmousedown = e => e.stopPropagation();
      });
      const rt = el.querySelector(".rst");
      if (rt) rt.onclick = e => {
        e.stopPropagation();
        askConfirm("♻️ 重置讨论战绩",
          `把「${tp.title}」的讨论记录清空？\n\n议题本身会保留，清完就能重新讨论。已经落盘的日志文件不会删。`,
          "重置", async () => {
            await fetch("/topics/reset", {
              method: "POST", headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ title: tp.title })
            });
            showLib();
          });
      };
      const dl = el.querySelector(".del");
      if (dl) dl.onclick = e => {
        e.stopPropagation();
        askConfirm("🗑 删除议题",
          `确定把「${tp.title}」从议题库删掉？\n\n会写回 topics.md —— 删了就没了。`,
          "删除", async () => {
            await fetch("/topics/delete", {
              method: "POST", headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ index: tp.index })
            });
            showLib();
          });
      };
      attachDnD(el);
      libList.appendChild(el);
    });
  }).catch(() => { libSub.textContent = "读不到议题（服务没起来？）"; });
}
document.getElementById("libBtn").onclick = showLib;
document.getElementById("libClose").onclick = () => libModal.classList.add("hidden");

/* ⭐ 通用确认框 */
const cfModal = document.getElementById("cfModal");
let cfAction = null;
function askConfirm(title, body, yesText, action) {
  document.getElementById("cfTitle").textContent = title;
  document.getElementById("cfBody").textContent = body;
  document.getElementById("cfYes").textContent = yesText;
  cfAction = action;
  cfModal.classList.remove("hidden");
}
document.getElementById("cfNo").onclick = () => { cfModal.classList.add("hidden"); cfAction = null; };
document.getElementById("cfYes").onclick = async () => {
  cfModal.classList.add("hidden");
  const act = cfAction;
  cfAction = null;
  if (act) await act();
};

/* ⭐ 增加议题弹窗 */
const addModal = document.getElementById("addModal");
function showAdd() {
  document.getElementById("addTitle").value = "";
  document.getElementById("addReason").value = "";
  document.getElementById("addAuthor").value = "";
  document.getElementById("addErr").textContent = "";
  addModal.classList.remove("hidden");
  setTimeout(() => document.getElementById("addTitle").focus(), 50);
}
async function saveAdd() {
  const title = document.getElementById("addTitle").value.trim();
  const reason = document.getElementById("addReason").value.trim();
  const author = document.getElementById("addAuthor").value.trim();
  const err = document.getElementById("addErr");
  if (!title) { err.textContent = "⚠️ 议题题目不能空着"; return; }
  err.textContent = "";
  const r = await fetch("/topics/add", {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ title, reason, author })
  });
  const j = await r.json();
  if (j.ok) {
    addModal.classList.add("hidden");
    showLib();                      // ⭐ 回到议题一览，能看到新加的那条
  } else {
    err.textContent = "⚠️ 保存失败（题目重复了？换个说法试试）";
  }
}
document.getElementById("addCancel").onclick = () => addModal.classList.add("hidden");
document.getElementById("addSave").onclick = saveAdd;
document.getElementById("addTitle").addEventListener("keydown", e => {
  if (e.key === "Enter") document.getElementById("addReason").focus();   // ⭐ 题目只有一行，回车跳下一栏
});
/* ── ⭐ 现场提问：选一位在座的 AI，让它提议题备选，点「添加N」直接入库 ── */
const laPanel = document.getElementById("laPanel");
const laAvatars = document.getElementById("laAvatars");
const laStatus = document.getElementById("laStatus");
const laAnswer = document.getElementById("laAnswer");
const laWho = document.getElementById("laWho");
const laBubble = document.getElementById("laBubble");
const laBtns = document.getElementById("laBtns");

document.getElementById("liveAsk").onclick = async () => {
  if (!laPanel.classList.contains("hidden")) {     // 再点一次收起
    laPanel.classList.add("hidden");
    return;
  }
  laPanel.classList.remove("hidden");
  laAnswer.classList.add("hidden");
  laStatus.textContent = "正在看看谁在座…";
  laAvatars.innerHTML = "";
  try {
    const r = await fetch("/roster").then(x => x.json());
    const ready = (r.guests || []).filter(g => g.ready);       // ⭐ 没连上的不显示
    laStatus.textContent = ready.length ? "" : "⚠️ 现在没有已连接的 AI";
    ready.forEach(g => {
      const d = document.createElement("div");
      d.className = "la-av";
      d.title = `让 ${g.name} 提几个议题`;
      d.innerHTML = `<img src="/avatars/${g.who}.png" alt=""><span>${esc(g.name)}</span>`;
      d.onclick = () => askGuest(g);
      laAvatars.appendChild(d);
    });
  } catch (_) { laStatus.textContent = "⚠️ 读不到名单（服务没起来？）"; }
};

async function askGuest(g) {
  laAnswer.classList.add("hidden");
  laStatus.textContent = `${g.name} 正在想…（推理模型可能要十几秒）`;
  let j;
  try {
    const r = await fetch("/ask_guest", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ who: g.who })
    });
    j = await r.json();
  } catch (_) { laStatus.textContent = "⚠️ 请求失败（服务没响应）"; return; }
  if (!j.ok) { laStatus.textContent = "⚠️ " + (j.err || "它没能回答"); return; }

  laStatus.textContent = "";
  laWho.textContent = `${j.name} 说：`;
  const list = (j.topics && j.topics.length) ? j.topics : null;
  // ⭐ 有备选就逐条渲染「题目 + 理由」；没有就把原话整段显示
  if (list) {
    laBubble.innerHTML = list.map((c, i) =>
      `<div class="la-item"><div class="la-t">${i + 1}. ${esc(c.title)}</div>` +
      (c.reason ? `<div class="la-r">💡 ${esc(c.reason)}</div>` : "") + `</div>`).join("");
  } else {
    laBubble.textContent = j.text;
  }
  const cands = list || [{ title: j.text, reason: "" }];
  laBtns.innerHTML = "";
  cands.forEach((c, i) => {
    const b = document.createElement("button");
    b.textContent = cands.length > 1 ? `添加${i + 1}` : "添加";
    b.title = c.title.length > 60 ? c.title.slice(0, 60) + "…" : c.title;
    b.onclick = () => addCandidate(c.title, c.reason || j.text, j.name, b);
    laBtns.appendChild(b);
  });
  const again = document.createElement("button");
  again.className = "ghost";
  again.textContent = "再想想";
  again.onclick = () => askGuest(g);            // ⭐ 让它再提一批
  laBtns.appendChild(again);
  laAnswer.classList.remove("hidden");
}

async function addCandidate(title, reason, author, btn) {
  btn.disabled = true;
  btn.textContent = "写入中…";
  const short = title.length > 110 ? title.slice(0, 108) + "…" : title;
  const r = await fetch("/topics/add", {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ title: short, reason, author })
  });
  const j = await r.json();
  if (j.ok) {
    addModal.classList.add("hidden");
    laPanel.classList.add("hidden");
    showLib();                                  // ⭐ 直接回议题一览，能看见新加的那条
  } else {
    btn.disabled = false;
    btn.textContent = "添加失败，再试";
  }
}

/* ⭐ 议题一览的「增加议题」入口 */
document.getElementById("libAdd").onclick = showAdd;

mStart.onclick = async () => {
  if (!canStart || pickedTopic === null) return;
  const t = topicList.querySelector(`.titem[data-index="${pickedTopic}"] .tt`);
  if (t) {
    document.getElementById("topicText").textContent = t.textContent;
    document.getElementById("topicBar").classList.add("on");
  }
  hideModal();
  await fetch("/start", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ topic_index: pickedTopic })
  });
};
document.getElementById("mClose").onclick = hideModal;
document.getElementById("changeTopic").onclick = showModal;
document.getElementById("startBtn").onclick = showModal;

/* ── ⭐ 结束议题：停 → 问阿鱼要不要整理 ── */
const askModal = document.getElementById("askModal");
document.getElementById("stopBtn").onclick = async () => {
  await fetch("/stop", { method: "POST" });
  askModal.classList.remove("hidden");        // ⭐ 停完立刻问一句
};
document.getElementById("askYes").onclick = async () => {
  askModal.classList.add("hidden");
  await fetch("/summarize", { method: "POST" });   // 阿鱼去整理，结果走 SSE 推回来
};
document.getElementById("askNo").onclick = () => askModal.classList.add("hidden");

/* ── 消息渲染 ── */
const LONG = 260;        // ⭐ 超过这个字数就折叠，免得一场讨论刷出几千行

function addBubbleText(el, text) {
  if (text.length <= LONG) { el.textContent = text; return; }
  const short = text.slice(0, LONG);
  el.textContent = short + "…";
  const btn = document.createElement("span");
  btn.className = "more";
  let open = false;
  btn.textContent = `展开全文（共 ${text.length} 字）`;
  btn.onclick = () => {
    open = !open;
    el.textContent = open ? text : short + "…";
    el.appendChild(btn);
    btn.textContent = open ? "收起" : `展开全文（共 ${text.length} 字）`;
  };
  el.appendChild(btn);
}

function addMsg(m) {
  if (m.seq && m.seq <= lastSeq) return;
  if (m.seq) lastSeq = m.seq;

  if (m.kind === "round") {
    const d = document.createElement("div");
    d.className = "sys round";
    d.innerHTML = `<span>${esc(m.text)}</span>`;
    flow.appendChild(d);
    flow.scrollTop = flow.scrollHeight;
    return;
  }
  // ⭐ 最终会议纪要（阿鱼整理的那份大总结）—— 单独的大卡片
  if (m.kind === "summary") {
    const d = document.createElement("div");
    d.className = "summary";
    d.innerHTML = `<div class="sh">📝 会议纪要 · 阿鱼整理</div>${esc(m.text)}`;
    flow.appendChild(d);
    flow.scrollTop = flow.scrollHeight;
    return;
  }
  // ⭐ 每轮的小纪要（公用历史框）单独做成卡片
  if (m.kind === "system" && (m.text || "").startsWith("📝")) {
    const d = document.createElement("div");
    d.className = "notes";
    const parts = m.text.split("\n");
    d.innerHTML = `<div class="nh">${esc(parts[0])}</div>${esc(parts.slice(1).join("\n"))}`;
    flow.appendChild(d);
    flow.scrollTop = flow.scrollHeight;
    return;
  }
  if (m.kind === "system" || m.who === "system") {
    const d = document.createElement("div");
    d.className = "sys";
    d.innerHTML = `<span>${esc(m.text)}</span>`;
    flow.appendChild(d);
    flow.scrollTop = flow.scrollHeight;
    return;
  }

  const me = m.who === "boss";
  const row = document.createElement("div");
  row.className = "row" + (me ? " me" : "");
  row.dataset.who = m.who;
  row.innerHTML =
    `<img class="av" src="/avatars/${m.who}.png" alt="">` +
    `<div class="body">` +
      `<div class="meta"><span class="nm">${esc(m.name)}</span>` +
      (m.org ? `<span class="org">${esc(m.org)}</span>` : "") +
      `<span class="org">${esc(m.ts || "")}</span></div>` +
      `<div class="bubble"></div>` +
    `</div>`;
  addBubbleText(row.querySelector(".bubble"), m.text || "");
  flow.appendChild(row);
  flow.scrollTop = flow.scrollHeight;

  if (m.round && m.round !== lastRound) {
    lastRound = m.round;
    badge.textContent = `第 ${m.round} 轮`;
  }
}

const es = new EventSource("/stream");
es.onmessage = e => { try { addMsg(JSON.parse(e.data)); } catch (_) {} };
es.onerror = () => { badge.textContent = "连接断开…"; };

/* ── 旁听席发言 ── */
async function send() {
  const inp = document.getElementById("msg");
  const t = inp.value.trim();
  if (!t) return;
  inp.value = "";
  await fetch("/say", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ text: t })
  });
}
document.getElementById("send").onclick = send;
document.getElementById("msg").addEventListener("keydown", e => {
  if (e.key === "Enter") send();
});
